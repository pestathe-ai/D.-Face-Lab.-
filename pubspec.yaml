name: d_face_lab
description: "D. Face Lab: scambio volti in foto e video, direttamente sul telefono."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  ffmpeg_kit_flutter_new: ^4.6.7
  image: ^4.5.0
  image_picker: ^1.2.0
  gal: ^2.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1D3A8A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true
